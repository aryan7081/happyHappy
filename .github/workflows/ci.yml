# Tests → Terraform → Docker → ECS/EKS.
# Deploy when: workflow_dispatch OR push to default branch OR push to DEPLOY_FROM_BRANCH OR (internal PR AND DOCKER_DEPLOY_ON_PR=true).
# Fork PRs: no Terraform/Docker without secrets.

name: CI / CD Pipeline

concurrency:
  group: cicd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["**"]
  # No `branches:` filter = run for PRs into any base branch. (Glob `**` alone is easy to misconfigure.)
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      terraform_apply:
        description: Terraform apply (manual; push applies only on default or DEPLOY_FROM_BRANCH branches)
        type: boolean
        default: true
      deploy_target:
        description: Container platform after build
        type: choice
        options: [ecs, eks]
        default: ecs

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  PROJECT_NAME: corefit
  TF_VAR_aws_region: ${{ secrets.AWS_REGION }}
  TF_VAR_django_secret_key: ${{ secrets.DJANGO_SECRET_KEY }}

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Run linter
        run: flake8 coreFit mysite

      - name: Run tests with coverage and JUnit report
        env:
          SECRET_KEY: test-key-for-ci
          DEBUG: "True"
          RAZORPAY_KEY_ID: ""
          RAZORPAY_KEY_SECRET: ""
        run: |
          mkdir -p test-results
          pytest coreFit/tests.py --junitxml=test-results/junit-backend.xml --cov=coreFit --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Upload backend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/test-results/junit-backend.xml
            backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run tests with coverage and JUnit report
        env:
          CI: true
          JEST_JUNIT_OUTPUT_DIR: test-results
          JEST_JUNIT_OUTPUT_NAME: junit-frontend.xml
        run: npm run test:ci

      - name: Upload frontend test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-test-reports
          path: |
            frontend/test-results/junit-frontend.xml
            frontend/coverage/

  terraform-infra:
    name: Terraform (fmt, validate, plan, conditional apply)
    needs: [backend, frontend]
    if: >-
      ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
    runs-on: ubuntu-latest
    env:
      TF_VAR_manage_ecr_repository: ${{ vars.TF_MANAGE_ECR == 'true' && 'true' || 'false' }}
      TF_VAR_project_name: ${{ env.PROJECT_NAME }}
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform fmt -check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Adopt existing AWS resources into Terraform state
        run: bash ../scripts/terraform-adopt-state.sh

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan -input=false

      - name: Terraform Apply
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && github.event.inputs.terraform_apply == true)
          || (
            github.event_name == 'push'
            && (
              github.ref_name == github.event.repository.default_branch
              || (
                vars.DEPLOY_FROM_BRANCH != ''
                && github.ref_name == vars.DEPLOY_FROM_BRANCH
              )
            )
          ) }}
        run: terraform apply -auto-approve tfplan

  docker-build-push-deploy:
    name: Docker build / push and deploy
    needs: [backend, frontend, terraform-infra]
    if: >-
      ${{ always()
      && needs.backend.result == 'success'
      && needs.frontend.result == 'success'
      && needs.terraform-infra.result == 'success'
      && (
        github.event_name == 'workflow_dispatch'
        || (
          github.event_name == 'pull_request'
          && github.event.pull_request.head.repo.fork == false
          && vars.DOCKER_DEPLOY_ON_PR == 'true'
        )
        || (
          github.event_name == 'push'
          && (
            github.ref_name == github.event.repository.default_branch
            || (
              vars.DEPLOY_FROM_BRANCH != ''
              && github.ref_name == vars.DEPLOY_FROM_BRANCH
            )
          )
        )
      ) }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Resolve deploy target
        id: target
        run: |
          D="${{ github.event.inputs.deploy_target }}"
          if [ -z "$D" ] || [ "$D" = "null" ]; then
            D="${{ vars.DEPLOY_TARGET }}"
          fi
          D="${D:-ecs}"
          echo "deploy_target=$D" >> "$GITHUB_OUTPUT"
          echo "Deploy target: $D"

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set image tag
        id: meta
        run: echo "IMAGE_URI=${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        env:
          IMAGE_URI: ${{ steps.meta.outputs.IMAGE_URI }}
        run: |
          docker build -t "$IMAGE_URI" -t ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:latest backend
          docker push "$IMAGE_URI"
          docker push ${{ steps.ecr.outputs.registry }}/${{ env.PROJECT_NAME }}-backend:latest

      - name: Deploy to ECS (Fargate)
        if: ${{ steps.target.outputs.deploy_target != 'eks' }}
        run: |
          aws ecs update-service \
            --cluster "${{ env.PROJECT_NAME }}-cluster" \
            --service "${{ env.PROJECT_NAME }}-service" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for ECS service stability
        if: ${{ steps.target.outputs.deploy_target != 'eks' }}
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.PROJECT_NAME }}-cluster" \
            --services "${{ env.PROJECT_NAME }}-service" \
            --region "${{ env.AWS_REGION }}"

      - name: EKS deploy (not configured)
        if: ${{ steps.target.outputs.deploy_target == 'eks' }}
        run: |
          echo "::error::DEPLOY_TARGET=eks selected but no EKS steps are defined. Add kubectl/helm and cluster auth, or set DEPLOY_TARGET / workflow input to ecs."
          exit 1
